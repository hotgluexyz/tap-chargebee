name: Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tap and smoke-test harness
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # Singer pins pytz 2018.4; newer pandas needs newer pytz.
          # pandas 1.3.x also requires the NumPy 1.x ABI.
          pip install . hotglue-smoke-test 'pandas<1.4' 'numpy<2'

      - name: Replay colocated smoke tests
        run: |
          source .venv/bin/activate
          hotglue-smoke-test run
